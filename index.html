<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ático Restaurante Vintage - Pedidos</title>
<meta name="description" content="Menú y pedidos de Ático Restaurante Vintage: hamburguesas, brunch, comida mexicana, sodas y más.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0c09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0c09;--panel:#1a1511;--panel2:#241d16;--oro:#e2b45a;--oro2:#a9822f;--txt:#f3e9d6;--mute:#9b8f7b;--papel:#f1e6cf;--tinta:#2b2218;--rojo:#b8473f;--verde:#4c9a68}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Karla,Arial,sans-serif;background:radial-gradient(ellipse at 50% -10%,#2f2418 0,var(--bg) 60%) fixed;color:var(--txt);padding-bottom:96px;overflow-x:hidden}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;align-items:center;gap:14px;padding:18px 16px 14px;border-bottom:1px solid #3a2e20}
.logo{width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--oro2);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:52px;height:52px;object-fit:contain}
header h1{font-size:38px;line-height:1;color:var(--oro);letter-spacing:.5px}
header p{font-size:13px;color:var(--mute);margin-top:4px;font-style:italic}

#hero{text-align:center;padding:56px 22px}
#hero h2{font-size:30px;line-height:1.2;margin-bottom:10px}
#hero p{color:var(--mute);max-width:32ch;margin:0 auto 26px;line-height:1.5}

.btn{border:1px solid var(--oro2);background:transparent;color:var(--oro);padding:12px 18px;border-radius:6px;font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--oro);color:#1a1208;border-color:var(--oro)}
.btn.red{border-color:var(--rojo);color:#e58a82}
.btn.big{font-size:18px;padding:16px 28px}

#diabar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid #3a2e20;font-size:13px;color:var(--mute)}
#diabar b{color:var(--txt)}
#diabar .btn{padding:8px 12px;font-size:13px}

.sticky{position:sticky;top:0;z-index:50;background:rgba(15,12,9,.96);backdrop-filter:blur(6px);border-bottom:1px solid #3a2e20}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tk{flex:none;text-align:left;background:var(--papel);color:var(--tinta);border:0;border-radius:4px;padding:7px 12px;min-width:96px;font-family:'Courier Prime',monospace;display:flex;flex-direction:column;border-left:5px solid var(--oro2)}
.tk b{font-size:14px}.tk small{font-size:12px;opacity:.75}
.tk.on{outline:2px solid var(--oro);outline-offset:1px;border-left-color:var(--rojo)}
.tk.paid{opacity:.55;border-left-color:var(--verde)}
.tk.nuevo{background:transparent;color:var(--oro);border:1px dashed var(--oro2);justify-content:center;font-family:Karla,sans-serif;font-weight:700}
.pill{flex:none;background:transparent;border:1px solid #4a3b28;color:var(--txt);padding:6px 14px;border-radius:20px;font-size:13px;text-transform:capitalize}
.pill:active{background:var(--oro);color:#1a1208}
#nav{padding-top:0}

.cat{font-size:26px;color:var(--oro);padding:26px 16px 10px;text-transform:capitalize;display:flex;align-items:center;gap:12px;scroll-margin-top:170px}
.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--oro2),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px}
.card{background:var(--panel);border:1px solid #33281b;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:116px;object-fit:cover;background:var(--panel2)}
.cb{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.card h3{font-size:17px;line-height:1.15;text-transform:capitalize}
.row{display:flex;align-items:center;justify-content:space-between}
.pr{font-family:'DM Serif Display',serif;color:var(--oro);font-size:18px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--oro);color:#1a1208;font-size:24px;line-height:1;font-weight:700}
.add:active{transform:scale(.9)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0a0806;border-top:1px solid var(--oro2)}
#barinfo{flex:1;min-width:0;display:flex;flex-direction:column}
#barinfo small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barinfo b{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400}
#bar .btn{padding:11px 14px}

#back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(100%,430px);z-index:100;background:var(--bg);transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;padding:14px}
body.open #panel{transform:none}body.open #back{opacity:1;pointer-events:auto}
#ticket{background:var(--papel);color:var(--tinta);font-family:'Courier Prime',monospace;padding:18px 16px 22px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#ticket .th{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px dashed #8a7a5c;padding-bottom:10px;margin-bottom:10px}
#ticket h2{font-family:'Courier Prime',monospace;font-weight:700;font-size:22px}
#ticket p{font-size:13px;opacity:.75}
.x{background:none;border:0;color:inherit;font-size:18px;padding:4px 8px}
.env{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px}
.chip{border:1px solid #8a7a5c;background:transparent;color:var(--tinta);border-radius:14px;padding:4px 10px;font-family:inherit;font-size:12px}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.li{border-bottom:1px dashed #b3a283;padding:8px 0}
.lr{display:flex;align-items:center;gap:8px;font-weight:700;text-transform:capitalize}
.lr span:first-child{flex:1}
.ads{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.nota{width:100%;background:rgba(43,34,24,.07);border:1px dashed #8a7a5c;color:var(--tinta);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;margin-top:4px}
textarea.nota{height:62px;resize:none;margin-top:12px}
.vacio{text-align:center;padding:18px 6px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;border-top:2px dashed #8a7a5c;margin-top:14px;padding-top:12px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.acts .btn{border-color:var(--tinta);color:var(--tinta);font-family:Karla,sans-serif}
.acts .btn.gold{background:var(--tinta);color:var(--papel)}
.acts .btn.red{border-color:var(--rojo);color:var(--rojo)}

dialog{margin:auto;border:1px solid var(--oro2);border-radius:10px;background:var(--panel);color:var(--txt);padding:22px;width:min(92%,380px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:24px;color:var(--oro);margin-bottom:6px}
dialog p{color:var(--mute);font-size:14px;margin-bottom:14px}
dialog input{width:100%;padding:12px;border-radius:6px;border:1px solid var(--oro2);background:var(--bg);color:var(--txt);font-size:16px;margin-bottom:14px}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--oro);color:#1a1208;padding:9px 16px;border-radius:20px;font-weight:700;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.buscar{display:flex;gap:8px;padding:0 12px 8px}
.buscar input{flex:1;min-width:0;padding:10px 14px;border-radius:20px;border:1px solid #4a3b28;background:var(--panel);color:var(--txt);font-size:15px}
.lista .grid{grid-template-columns:1fr;gap:6px}
.lista .card{flex-direction:row;align-items:center}
.lista .card img{width:52px;height:52px;border-radius:6px;margin-left:8px;flex:none}
.lista .cb{flex-direction:row;align-items:center;padding:8px 10px;gap:10px}
.lista .card h3{flex:1;font-size:16px}
.lista .cb .row{gap:12px}
.lista .cat{padding-top:18px;font-size:22px}
.pay{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
#ticket .cambio{font-size:20px;opacity:1;margin-top:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}main{max-width:1000px;margin:auto}.lista .grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png" alt="Logo de Ático"></div>
  <div><h1>Ático</h1><p>Restaurante vintage</p></div>
</header>

<main>
<section id="hero">
  <h2>¿Listo para abrir el día?</h2>
  <p>Empieza el día laboral y abre una cuenta por cada grupo que llegue.</p>
  <button class="btn gold big" data-a="empezar">Empezar día laboral</button>
</section>

<section id="app" hidden>
  <div id="diabar"><span id="diainfo"></span><button class="btn red" data-a="terminar">Terminar día laboral</button></div>
  <div class="sticky">
    <div class="scroller" id="acc"></div>
    <div class="buscar"><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" autocomplete="off"><button class="pill" id="vbtn" data-a="vista">Fotos</button></div>
    <div class="scroller" id="nav"></div>
  </div>
  <div id="menu"></div>
</section>
</main>

<div id="bar" hidden>
  <div id="barinfo"></div>
  <button class="btn" data-a="cart">Ver cuenta (<span id="cnt">0</span>)</button>
  <button class="btn gold" data-a="wa">Enviar</button>
</div>

<div id="back" data-a="cart"></div>
<aside id="panel" aria-label="Cuenta"><div id="ticket"></div></aside>

<dialog id="dlg">
  <h2>Nueva cuenta</h2>
  <p>Escribe la mesa o el nombre del grupo.</p>
  <input id="nn" placeholder="Ej: Mesa 3, Familia Pérez" maxlength="30" autocomplete="off">
  <div class="two">
    <button class="btn gold" data-a="crear" data-v="ÁTICO">En el local</button>
    <button class="btn gold" data-a="crear" data-v="PARA LLEVAR">Para llevar</button>
  </div>
  <button class="btn" style="width:100%" data-a="cerrardlg">Cancelar</button>
</dialog>
<div id="toast" role="status"></div>

<script>
const WA="573106505193";
const FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#241d16"/><text x="150" y="112" font-size="48" text-anchor="middle" fill="#a9822f">Á</text></svg>');
// [nombre, categoría, precio en el local, precio para llevar, imagen]
const M=[
["INGLESA","HAMBURGUESAS",22000,23000,"inglesa.jpg"],["BROOKLYN","HAMBURGUESAS",21000,22000,"brooklyn.jpg"],
["YORK","HAMBURGUESAS",21000,22000,"york.jpg"],["ALOHA","HAMBURGUESAS",23000,24000,"aloha.jpg"],
["MANCHESTER","HAMBURGUESAS",26000,27000,"manchester.jpg"],["ÁMSTERDAM","HAMBURGUESAS",26000,27000,"amsterdam.jpg"],
["BRUNCH MIX","BRUNCH",27000,28000,"brunch_mix.jpg"],["BRUNCH","BRUNCH",20000,21000,"brunch.jpg"],
["BRUNCH DE POLLO","BRUNCH",20000,21000,"brunch_pollo.jpg"],
["TACOS DE RES","COMIDA MEXICANA",22000,23000,"tacos.jpg"],["TACOS DE POLLO","COMIDA MEXICANA",22000,23000,"tacos.jpg"],
["TACOS DE CAMARONES","COMIDA MEXICANA",25000,26000,"tacoscam.jpg"],
["QUESADILLA DE POLLO","COMIDA MEXICANA",22000,23000,"quesadillas.jpg"],["QUESADILLA DE RES","COMIDA MEXICANA",22000,23000,"quesadillas.jpg"],
["PAPAS COLOMBIANAS","PAPAS",22000,23000,"colombianas.jpg"],
["ADICIÓN DE TOCINETA","ADICIONES",2000,2000,"tocineta.jpg"],["ADICIÓN DE PAPAS","ADICIONES",4000,4000,"papas.jpg"],
["ADICIÓN DE CARNE","ADICIONES",5000,5000,"carne.jpg"],["ADICIÓN SALSA","ADICIONES",1000,1000,"salsa.jpg"],
["ADICIÓN QUESO","ADICIONES",1000,1000,"queso.jpg"],
["MANGO BICHE","SODA",7000,7000,"mango.jpg"],["FRESA","SODA",7000,7000,"sfresa.jpg"],["MORA AZUL","SODA",7000,7000,"smora_azul.jpg"],
["SANDÍA","SODA",7000,7000,"ssandia.jpg"],["MANDARINA","SODA",7000,7000,"smandarina.jpg"],["MANZANA VERDE","SODA",7000,7000,"smanzanaV.jpg"],
["MICHELADA DE SODA","SODA",7000,7000,"misoda.jpg"],["MARACUYÁ","SODA",7000,7000,"smaracuya.jpg"],["TAMARINDO","SODA",7000,7000,"stamarindo.jpg"],
["COCA COLA","BEBIDAS",6000,6000,"coca.jpg"],["CORONITA","BEBIDAS",5000,5000,"coronita.jpg"],["AGUA","BEBIDAS",3000,3000,"agua.jpg"],
["TINTO","BEBIDAS",1500,1500,"tinto.jpg"],["AROMÁTICA","BEBIDAS",1500,1500,"aromatica.jpg"],["VINO","BEBIDAS",7000,6000,"vino.jpg"]
];
const CATS=["HAMBURGUESAS","BRUNCH","COMIDA MEXICANA","PAPAS","ADICIONES","SODA","BEBIDAS"];
const CONADS=["HAMBURGUESAS","BRUNCH","COMIDA MEXICANA","PAPAS"];
const ADS=M.map((m,i)=>m[1]==="ADICIONES"?i:-1).filter(i=>i>=0);
const ENVIOS=[{t:"LOCAL",p:5000},{t:"FORÁNEO",p:6000}];
const EMPTY={activo:false,inicio:0,cuentas:[],activa:null,seq:0};

let S;
try{S=JSON.parse(localStorage.getItem("atico_dia"))||{...EMPTY}}catch(e){S={...EMPTY}}
const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n).toLocaleString("es-CO");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem("atico_dia",JSON.stringify(S))}catch(e){}};
const act=()=>S.cuentas.find(c=>c.id===S.activa);
const pr=(m,c)=>c.modo==="ÁTICO"?m[2]:m[3];
const itemTot=(it,c)=>pr(M[it.i],c)+it.ads.reduce((s,a)=>s+pr(M[a],c),0);
const total=c=>c.items.reduce((s,it)=>s+itemTot(it,c),0)+(c.envio?c.envio.p:0);
const low=s=>s.toLowerCase();
let tt;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1600)}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function renderMenu(){
  const c=act(),modo=c?c.modo:"ÁTICO",q=norm(($("q")||{value:""}).value.trim());let h="",n="";
  CATS.forEach(cat=>{const ms=M.map((_,i)=>i).filter(i=>M[i][1]===cat&&(!q||norm(M[i][0]).includes(q)));if(!ms.length)return;
    n+=`<button class="pill" data-a="cat" data-v="${cat}">${low(cat)}</button>`;
    h+=`<h2 class="cat" id="cat-${cat.replace(/ /g,"_")}">${low(cat)}</h2><div class="grid">`;
    ms.forEach(i=>{const m=M[i];
      h+=`<article class="card"><img src="${m[4]}" alt="${low(m[0])}" loading="lazy" onerror="this.onerror=null;this.src=FB"><div class="cb"><h3>${low(m[0])}</h3><div class="row"><span class="pr">${money(modo==="ÁTICO"?m[2]:m[3])}</span><button class="add" data-a="add" data-v="${i}" aria-label="Añadir ${low(m[0])}">+</button></div></div></article>`});
    h+=`</div>`});
  $("menu").innerHTML=h||'<p style="padding:30px;text-align:center;color:var(--mute)">No hay productos con ese nombre.</p>';$("nav").innerHTML=n;
}
function renderAcc(){
  $("acc").innerHTML=S.cuentas.map(c=>`<button class="tk ${c.id===S.activa?"on":""} ${c.pagada?"paid":""}" data-a="selc" data-v="${c.id}"><b>${esc(c.nombre)}</b><small>${c.modo==="ÁTICO"?"Local":"Llevar"} ${money(total(c))}</small></button>`).join("")+`<button class="tk nuevo" data-a="nueva">+ Nueva cuenta</button>`;
  const vend=S.cuentas.reduce((s,c)=>s+total(c),0);
  const hora=S.inicio?new Date(S.inicio).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}):"";
  const por=x=>S.cuentas.filter(c=>c.pagada&&c.metodo===x).reduce((s,c)=>s+total(c),0);
  $("diainfo").innerHTML=`Día desde las <b>${hora}</b>, <b>${S.cuentas.length}</b> cuentas<br>Vendido <b>${money(vend)}</b><br>Cobrado: efectivo ${money(por("EFECTIVO"))}, transf. ${money(por("TRANSFERENCIA"))}, tarjeta ${money(por("TARJETA"))}`;
}
function cambioTxt(c){const t=total(c),r=c.recibido||0;if(!r)return"";return r>=t?`Cambio: <b>${money(r-t)}</b>`:`Faltan: <b>${money(t-r)}</b>`}
function payHtml(c){
  let h=`<div class="pay"><span>Pago:</span>${["EFECTIVO","TRANSFERENCIA","TARJETA"].map(x=>`<button class="chip ${c.metodo===x?"on":""}" data-a="metodo" data-v="${x}">${low(x)}</button>`).join("")}</div>`;
  if(c.metodo==="EFECTIVO")h+=`<div class="pay"><span>Recibido:</span><button class="chip" data-a="rec" data-v="${total(c)}">exacto</button><button class="chip" data-a="rec" data-v="50000">$50.000</button><button class="chip" data-a="rec" data-v="100000">$100.000</button></div><input id="recibido" type="number" inputmode="numeric" class="nota" placeholder="Otro valor recibido" value="${c.recibido||""}"><p id="cambio" class="cambio">${cambioTxt(c)}</p>`;
  return h}
function renderCart(){
  const c=act(),box=$("ticket");
  if(!c){box.innerHTML=`<div class="th"><h2>Sin cuenta</h2><button class="x" data-a="cart" aria-label="Cerrar">✕</button></div><p class="vacio">Abre una cuenta para tomar el pedido.</p><div class="acts"><button class="btn gold" data-a="nueva">Nueva cuenta</button></div>`;return}
  let h=`<div class="th"><div><h2>${esc(c.nombre)}</h2><p>${c.modo==="ÁTICO"?"En el local":"Para llevar"}${c.pagada?", pagada":""}</p></div><button class="x" data-a="cart" aria-label="Cerrar">✕</button></div>`;
  if(c.modo!=="ÁTICO")h+=`<div class="env"><span>Domicilio:</span>${ENVIOS.map(e=>`<button class="chip ${c.envio&&c.envio.t===e.t?"on":""}" data-a="envio" data-v="${e.t}">${low(e.t)} ${money(e.p)}</button>`).join("")}<button class="chip ${!c.envio?"on":""}" data-a="envio" data-v="">sin domicilio</button></div>`;
  if(!c.items.length)h+=`<p class="vacio">Aún no hay productos en esta cuenta.</p>`;
  c.items.forEach((it,k)=>{const m=M[it.i];
    h+=`<div class="li"><div class="lr"><span>${low(m[0])}</span><span>${money(itemTot(it,c))}</span><button class="x" data-a="del" data-v="${k}" aria-label="Quitar ${low(m[0])}">✕</button></div>`;
    if(CONADS.includes(m[1]))h+=`<div class="ads">${ADS.map(a=>`<button class="chip ${it.ads.includes(a)?"on":""}" data-a="ad" data-v="${k}:${a}">+ ${low(M[a][0].replace(/^ADICI[OÓ]N (DE )?/,""))} ${money(pr(M[a],c))}</button>`).join("")}</div>`;
    h+=`<input class="nota" data-nota="${k}" placeholder="Nota:" value="${esc(it.nota||"")}"></div>`});
  h+=`<textarea id="notaG" class="nota" placeholder="Notas generales de la cuenta">${esc(c.nota||"")}</textarea>
  <div class="tot"><span>Total</span><span>${money(total(c))}</span></div>${payHtml(c)}
  <div class="acts"><button class="btn gold" data-a="wa">Enviar por WhatsApp</button><button class="btn" data-a="pagar">${c.pagada?"Reabrir cuenta":"Marcar como pagada"}</button><button class="btn red" data-a="borrar">Eliminar cuenta</button></div>`;
  box.innerHTML=h;
}
function renderBar(){
  const c=act();$("bar").hidden=!S.activo;
  $("barinfo").innerHTML=c?`<small>${esc(c.nombre)}</small><b>${money(total(c))}</b>`:`<small>Sin cuenta activa</small><b>-</b>`;
  $("cnt").textContent=c?c.items.length:0;
}
function refresh(){renderAcc();renderCart();renderBar()}
function render(){
  $("hero").hidden=S.activo;$("app").hidden=!S.activo;
  if(S.activo){renderMenu();refresh()}else{renderBar();document.body.classList.remove("open")}
}
function openNew(){$("nn").value="";$("dlg").showModal();setTimeout(()=>$("nn").focus(),50)}

const A={
  empezar(){S={...EMPTY,activo:true,inicio:Date.now(),cuentas:[]};save();render();openNew()},
  terminar(){
    const vend=S.cuentas.reduce((s,c)=>s+total(c),0);
    if(confirm(`¿Terminar el día laboral?\n\nCuentas: ${S.cuentas.length}\nTotal del día: ${money(vend)}\n\nSe eliminarán todas las cuentas.`)){S={...EMPTY,cuentas:[]};save();render();toast("Día terminado")}
  },
  nueva(){document.body.classList.remove("open");openNew()},
  cerrardlg(){$("dlg").close()},
  crear(modo){
    S.seq++;const id=S.seq;
    S.cuentas.push({id,nombre:$("nn").value.trim()||"Cuenta "+id,modo,envio:null,nota:"",pagada:false,metodo:null,recibido:0,items:[]});
    S.activa=id;save();$("dlg").close();renderMenu();refresh();
  },
  selc(id){S.activa=+id;save();renderMenu();refresh()},
  cat(c){const e=$("cat-"+c.replace(/ /g,"_"));if(e)e.scrollIntoView({behavior:"smooth"})},
  cart(){document.body.classList.toggle("open")},
  add(i){
    const c=act();if(!c){openNew();return}
    c.items.push({i:+i,ads:[],nota:""});c.pagada=false;save();refresh();toast("Añadido: "+low(M[i][0]));
  },
  del(k){act().items.splice(+k,1);save();refresh()},
  ad(v){const [k,a]=v.split(":").map(Number),it=act().items[k],p=it.ads.indexOf(a);p>=0?it.ads.splice(p,1):it.ads.push(a);save();refresh()},
  envio(t){const c=act();c.envio=ENVIOS.find(e=>e.t===t)||null;save();refresh()},
  pagar(){const c=act();if(!c.pagada&&!c.metodo){toast("Elige el método de pago");return}if(!c.pagada&&c.metodo==="EFECTIVO"&&c.recibido&&c.recibido<total(c)){toast("El efectivo recibido no alcanza");return}c.pagada=!c.pagada;save();refresh()},
  metodo(v){const c=act();c.metodo=c.metodo===v?null:v;if(v!=="EFECTIVO")c.recibido=0;save();refresh()},
  rec(v){const c=act();c.recibido=+v;save();refresh()},
  vista(){const l=document.body.classList.toggle("lista");try{localStorage.setItem("atico_vista",l?"1":"0")}catch(e){}$("vbtn").textContent=l?"Fotos":"Lista"},
  borrar(){const c=act();if(confirm(`¿Eliminar la cuenta "${c.nombre}"?`)){S.cuentas=S.cuentas.filter(x=>x!==c);S.activa=S.cuentas.length?S.cuentas[S.cuentas.length-1].id:null;save();document.body.classList.remove("open");renderMenu();refresh()}},
  wa(){
    const c=act();if(!c||!c.items.length){toast("Agrega productos a la cuenta");return}
    let m=`*${c.modo} - ${c.nombre}*\n\n`;
    c.items.forEach(it=>{const mm=M[it.i];m+=`• *${mm[0]}* ${money(pr(mm,c))}\n`;
      it.ads.forEach(a=>m+=`   + ${M[a][0]} ${money(pr(M[a],c))}\n`);
      if(it.nota&&it.nota.trim())m+=`   _Nota: ${it.nota.trim()}_\n`});
    if(c.envio)m+=`\n• *Domicilio ${c.envio.t}* ${money(c.envio.p)}\n`;
    if(c.nota&&c.nota.trim())m+=`\n*Notas:* ${c.nota.trim()}\n`;
    m+=`\n*TOTAL: ${money(total(c))}*`;
    if(c.metodo){m+=`\nPago: ${c.metodo}`;if(c.metodo==="EFECTIVO"&&c.recibido>=total(c))m+=` (recibido ${money(c.recibido)}, cambio ${money(c.recibido-total(c))})`}
    window.open("https://wa.me/?text="+encodeURIComponent(m),"_blank");
  }
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){renderMenu();return}
  if(e.target.id==="recibido"){const k=act();if(k){k.recibido=+e.target.value||0;save();$("cambio").innerHTML=cambioTxt(k)}return}
  const c=act();if(!c)return;
  if(e.target.dataset.nota!==undefined){c.items[+e.target.dataset.nota].nota=e.target.value;save()}
  else if(e.target.id==="notaG"){c.nota=e.target.value;save()}
});
try{if(localStorage.getItem("atico_vista")!=="0")document.body.classList.add("lista")}catch(e){document.body.classList.add("lista")}
$("vbtn").textContent=document.body.classList.contains("lista")?"Fotos":"Lista";
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}})}
if(S.activo&&!act())S.activa=S.cuentas.length?S.cuentas[0].id:null;
render();
</script>
</body>
</html>
